name: Auto-Merge Valid Domain PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

# Satu run per PR; run lama dibatalkan kalau ada push baru
concurrency:
  group: auto-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validasi-dan-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Cek file yang diubah (Keamanan Mutlak)
        id: cek_file
        uses: actions/github-script@v7
        with:
          script: |
            // Ambil SEMUA file (paginasi), bukan hanya 30 pertama
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            // Daftar file yang boleh di-auto-merge tanpa persetujuan manual
            const fileAman = ['Allowlist.txt', 'EazyBlock.txt'];
            const semuaAman = files.length > 0 && files.every(f =>
              fileAman.includes(f.filename) && f.status !== 'renamed'
            );
            if (!semuaAman) {
              core.setFailed('PR menyentuh file sistem/lainnya. Butuh review manual dari EazyWhale.');
            }

      - name: Checkout isi PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validasi format domain
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          RE_DOMAIN = re.compile(r"^(?:\|\|)?(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}\^?$")
          # Lindungi domain vital agar tidak iseng diblokir di EazyBlock.txt
          ANTI_ISENG = {"google.com", "youtube.com", "github.com", "whatsapp.com", "cloudflare.com"}

          def dilindungi(domain):
              # Cocok persis ATAU subdomain (mis. accounts.google.com)
              return any(domain == d or domain.endswith("." + d) for d in ANTI_ISENG)

          for nama_file in ["Allowlist.txt", "EazyBlock.txt"]:
              p = Path(nama_file)
              if not p.exists():
                  continue
              for no, baris in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                  s = baris.strip().lower()
                  if not s or s.startswith(("!", "#")):
                      continue
                  if not RE_DOMAIN.match(s):
                      sys.exit(f"Format tidak valid di {nama_file} baris {no}: {baris}")
                  bersih = s.removeprefix("||").removesuffix("^")
                  if nama_file == "EazyBlock.txt" and dilindungi(bersih):
                      sys.exit(f"Domain dilindungi tidak boleh diblokir: {bersih}")
          print("Semua baris valid dan aman!")
          PY

      - name: Auto-Approve & Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              commit_id: sha,
              event: 'APPROVE',
              body: '🐋 Validasi format domain lulus otomatis. Terima kasih atas kontribusinya!'
            });
            // Merge dikunci ke commit yang sudah divalidasi
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash',
              sha: sha,
            });
