name: Auto-Merge Valid Domain PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validasi-dan-merge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Cek file yang diubah (Keamanan Mutlak)
        id: cek_file
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const fileAman = ['Allowlist.txt', 'Deletelist.txt', 'EazyBlock.txt'];
            const semuaAman = files.length > 0 && files.every(f =>
              fileAman.includes(f.filename) && ['modified', 'added'].includes(f.status)
            );
            if (!semuaAman) {
              core.setFailed('PR menyentuh file sistem/lainnya atau menghapus file. Butuh review manual dari EazyWhale.');
            }

      - name: Checkout isi PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validasi diff & format domain
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path

          # Wajib ||domain^ utuh ATAU domain polos (mendukung TLD punycode xn--)
          RE_RULE = re.compile(
              r"^(?:"
              r"\|\|(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:xn--[a-z0-9-]{1,59}|[a-z]{2,63})\^"
              r"|"
              r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:xn--[a-z0-9-]{1,59}|[a-z]{2,63})"
              r")$"
          )

          # Lindungi domain vital & TLD umum agar tidak iseng diblokir / di-allowlist massal
          ANTI_ISENG = {"google.com", "youtube.com", "github.com", "whatsapp.com", "cloudflare.com"}
          PUBLIC_SUFFIX = {
              "co.id", "my.id", "biz.id", "web.id", "or.id", "ac.id", "sch.id", "go.id",
              "co.uk", "com.au", "com.sg", "com.my", "co.jp", "co.kr", "com.vn", "co.th", "com.ph",
          }

          def dilindungi(domain):
              return any(domain == d or domain.endswith("." + d) for d in ANTI_ISENG)

          base_sha = os.environ["BASE_SHA"]
          target_files = ["Allowlist.txt", "Deletelist.txt", "EazyBlock.txt"]
          ada_tambahan = False

          for nama_file in target_files:
              p = Path(nama_file)
              if not p.exists():
                  continue

              diff = subprocess.check_output(
                  ["git", "diff", "--unified=0", base_sha, "HEAD", "--", nama_file],
                  text=True,
              )

              for dline in diff.splitlines():
                  # 1. Cegah penghapusan baris aturan lama tanpa review manual
                  if dline.startswith("-") and not dline.startswith("---"):
                      isi_lama = dline[1:].strip()
                      if isi_lama and not isi_lama.startswith(("!", "#")):
                          sys.exit(f"PR menghapus aturan di {nama_file} ({isi_lama}). Butuh review manual EazyWhale.")

                  # 2. Validasi HANYA baris baru (+) agar format komentar/pipa lama tidak bentrok
                  if dline.startswith("+") and not dline.startswith("+++"):
                      s = dline[1:].strip().lower()
                      if not s or s.startswith(("!", "#")):
                          continue
                      if not RE_RULE.match(s):
                          sys.exit(f"Format baris baru tidak valid di {nama_file}: {dline[1:]}")
                      bersih = s.removeprefix("||").removesuffix("^")
                      if bersih in PUBLIC_SUFFIX:
                          sys.exit(f"TLD publik tidak boleh dimasukkan sendirian: {bersih}")
                      if nama_file in ("EazyBlock.txt", "Deletelist.txt") and dilindungi(bersih):
                          sys.exit(f"Domain dilindungi tidak boleh diblokir: {bersih}")
                      ada_tambahan = True

          if not ada_tambahan:
              sys.exit("PR tidak menambahkan aturan domain baru yang valid.")

          print("Semua baris baru valid, aman, dan tidak ada aturan lama yang dihapus!")
          PY

      - name: Auto-Approve & Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              commit_id: sha,
              event: 'APPROVE',
              body: '🐋 Validasi format domain lulus otomatis. Terima kasih atas kontribusinya!'
            });
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash',
              sha: sha,
            });
