name: Build EazyLife (Zero Redundancy)

on:
  schedule:
    - cron: '0 0 * * *' # Update otomatis setiap hari jam 00:00 UTC
  workflow_dispatch: # Tombol jalankan manual kapan saja

permissions:
  contents: write

concurrency:
  group: build-eazylife
  cancel-in-progress: false

jobs:
  build-list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Siapkan workspace repo WhaleList
        uses: actions/checkout@v4

      - name: Tarik dari repo luar, gabung, & buang duplikat
        run: |
          python3 - <<'PY'
          import re, sys, time, datetime, urllib.request
          from pathlib import Path

          ALLOW = Path("Allowlist.txt")  # opsional: 1 domain per baris

          # Konfigurasi 3 file tujuan beserta sumber URL masing-masing
          TARGETS = [
              {
                  "file": "EazyLife-Core.txt",
                  "title": "EazyLife Core - Daily Ad & Tracker Blocklist",
                  "min_domains": 50000,
                  "sources": [
                      # (nama, url, format) -> format: abp | hosts | domains
                      ("HaGeZi Pro", "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                      ("HaGeZi Pop-Up Ads", "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/popupads.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                      ("ABPindo", "https://raw.githubusercontent.com/ABPindo/indonesianadblockrules/master/subscriptions/abpindo.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                  ],
              },
              {
                  "file": "EazyLife-Security.txt",
                  "title": "EazyLife Security - Anti-Phishing, Fake & Malware",
                  "min_domains": 5000,
                  "sources": [
                      ("HaGeZi Fake", "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/fake.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                      ("Phishing Army", "https://phishing.army/download/phishing_army_blocklist.txt", "domains"),  # ← isi url ini dengan url yang aku berikan
                      ("URLhaus", "https://urlhaus.abuse.ch/downloads/hostfile/", "hosts"),  # ← isi url ini dengan url yang aku berikan
                  ],
              },
              {
                  "file": "EazyLife-RouterTV.txt",
                  "title": "EazyLife Router & Smart TV - Lightweight & Telemetry Blocker",
                  "min_domains": 10000,
                  "sources": [
                      ("HaGeZi Light", "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/light.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                      ("ABPindo", "https://raw.githubusercontent.com/ABPindo/indonesianadblockrules/master/subscriptions/abpindo.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                      ("HaGeZi Native Samsung", "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/native.samsung.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                      ("HaGeZi Native LG webOS", "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/native.lgwebos.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                      ("HaGeZi Native Xiaomi", "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/native.xiaomi.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                      ("HaGeZi Native Roku", "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/native.roku.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                      ("HaGeZi Native Amazon", "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/native.amazon.txt", "abp"),  # ← isi url ini dengan url yang aku berikan
                  ],
              },
          ]

          # Opsi aturan yang aman diubah jadi blokir DNS penuh
          OPSI_AMAN = {"third-party", "3p", "important", "all", "popup"}

          RE_DOMAIN = re.compile(r"^(?=.{4,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:xn--[a-z0-9-]{1,59}|[a-z]{2,63})$")
          RE_ABP = re.compile(r"^\|\|([a-z0-9.-]+)\^(?:\$([a-z0-9,~=-]+))?$")
          RE_HOSTS = re.compile(r"^(?:0\.0\.0\.0|127\.0\.0\.1|::1?)\s+([^\s#]+)")

          def valid(d):
              return d if RE_DOMAIN.match(d) else None

          def parse_abp(s):
              m = RE_ABP.match(s)
              if not m:
                  return None
              if m.group(2) and not set(m.group(2).split(",")) <= OPSI_AMAN:
                  return None
              return valid(m.group(1))

          def parse_hosts(s):
              m = RE_HOSTS.match(s)
              return valid(m.group(1)) if m else None

          def parse_domains(s):
              return valid(s)

          PARSER = {"abp": parse_abp, "hosts": parse_hosts, "domains": parse_domains}

          def fetch(url, tries=3):
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "EazyLife-Builder/2.0"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read().decode("utf-8", errors="ignore").splitlines()
                  except Exception as e:
                      print(f"    percobaan {i + 1}/{tries} gagal: {e}")
                      time.sleep(3 * (i + 1))
              return None

          # Muat Allowlist sekali untuk dipakai ke semua file
          izin = set()
          if ALLOW.exists():
              izin = {
                  l.strip().lower()
                  for l in ALLOW.read_text(encoding="utf-8").splitlines()
                  if l.strip() and not l.lstrip().startswith(("!", "#"))
              }
              print(f"Allowlist aktif: {len(izin)} domain dikecualikan\n")

          ada_gagal = False

          for target in TARGETS:
              out_path = Path(target["file"])
              print(f"=== Membangun {out_path.name} ===")
              domains = set()
              berhasil = []

              for nama, url, fmt in target["sources"]:
                  print(f"  Tarik: {nama}")
                  baris = fetch(url)
                  if baris is None:
                      print(f"    LEWATI {nama}")
                      continue
                  sebelum = len(domains)
                  parse = PARSER[fmt]
                  for b in baris:
                      s = b.strip().lower()
                      if not s or s[0] in "!#[" or s.startswith("@@"):
                          continue
                      d = parse(s)
                      if d:
                          domains.add(d)
                  print(f"    +{len(domains) - sebelum} domain baru")
                  berhasil.append(nama)

              if izin:
                  domains -= izin

              if not berhasil or len(domains) < target["min_domains"]:
                  print(f"  GAGAL {out_path.name}: hanya {len(domains)} domain dari {len(berhasil)} sumber. File lama dibiarkan.\n")
                  ada_gagal = True
                  continue

              # Eliminasi subdomain jika domain induk sudah ada
              hasil = []
              for d in sorted(domains):
                  bagian = d.split(".")
                  if any(".".join(bagian[i:]) in domains for i in range(1, len(bagian) - 1)):
                      continue
                  hasil.append(d)

              aturan = [f"||{d}^" for d in hasil]

              # Jangan tulis ulang kalau isi aturan tidak berubah (hindari commit sia-sia)
              if out_path.exists():
                  lama = [l for l in out_path.read_text(encoding="utf-8").splitlines() if l and not l.startswith("!")]
                  if lama == aturan:
                      print(f"  Tidak ada perubahan aturan untuk {out_path.name}.\n")
                      continue

              waktu = datetime.datetime.now(datetime.timezone.utc).strftime("%Y.%m.%d.%H%M")
              header = [
                  f"! Title: {target['title']}",
                  "! Maintainer: EazyWhale",
                  f"! Version: {waktu}",
                  "! Expires: 1 day",
                  f"! Total Unique Domains: {len(hasil)}",
                  f"! Sources: {', '.join(berhasil)}",
                  "! --------------------------------------------------",
                  "",
              ]
              out_path.write_text("\n".join(header + aturan) + "\n", encoding="utf-8")
              print(f"  Selesai {out_path.name}: {len(hasil)} domain dari {len(berhasil)} sumber.\n")

          if ada_gagal:
              sys.exit(1)
          PY

      - name: Simpan semua file ke repo WhaleList
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EazyLife-Core.txt EazyLife-Security.txt EazyLife-RouterTV.txt # ← ganti ini ke file tujuan.
          git diff --staged --quiet || (git commit -m "chore: update EazyLife lists" && git push)
