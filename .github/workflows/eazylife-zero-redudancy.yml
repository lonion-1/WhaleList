name: Build EazyLife (Zero Redundancy)
# Copyright (c) 2026 <EazyWhale>
# Licensed under the MIT License.

on:
  schedule:
    - cron: '23 21 * * *' # Update otomatis setiap hari jam 04:23 WIB
  workflow_dispatch: # Tombol jalankan manual kapan saja

permissions:
  contents: write

concurrency:
  group: build-eazylife
  cancel-in-progress: false

jobs:
  build-list:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Siapkan workspace repo WhaleList
        uses: actions/checkout@v4

      - name: Bangun seluruh daftar (Root, Brands, & Custom)
        run: python3 scripts/build.py

      - name: Simpan semua file ke repo WhaleList
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          git commit -m "chore: update EazyLife lists"
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Push gagal, coba lagi ($i/3)..."
            sleep 5
          done
          exit 1
