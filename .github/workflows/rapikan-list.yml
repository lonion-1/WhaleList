name: Build EazyLife (Zero Redundancy)

on:
  schedule:
    - cron: '0 0 * * *' # Update otomatis setiap hari
  workflow_dispatch: # Tombol jalankan manual kapan saja

permissions:
  contents: write

jobs:
  build-list:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repo WhaleList
        uses: actions/checkout@v4

      - name: Gabung & Eliminasi Redundansi
        run: |
          python3 -c '
          import urllib.request, datetime

          # Ganti "USERNAME_KAMU" dengan username GitHub-mu agar list keluarga ikut tergabung
          sumber_url = [
              "https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-online.txt",
              "https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/annoyances.txt",
              "https://raw.githubusercontent.com/hoshsadiq/adblock-nocoin-list/master/nocoin.txt",
              "https://raw.githubusercontent.com/the-advoid/ad-void/main/AdVoid.Lite.txt"
              "https://raw.githubusercontent.com/DandelionSprout/adfilt/master/LegitimateURLShortener.txt"
              "https://raw.githubusercontent.com/brave/adblock-lists/master/brave-lists/brave-social.txt"
          ]

          domain_unik = set()

          def ekstrak_domain_dns(baris_teks):
              for b in baris_teks:
                  b = b.strip().lower()
                  if not b or b.startswith(("!", "#", "[", "@@", "/")) or "#" in b:
                      continue
                  if b.startswith("||") and "^" in b:
                      if "$" in b:
                          continue
                      dom = b.split("^").replace("||", "").strip()
                      if dom and "." in dom and not any(c in dom for c in ("/", "*", " ", ":")):
                          domain_unik.add(f"||{dom}^")

          for url in sumber_url:
              try:
                  req = urllib.request.urlopen(url, timeout=30)
                  isi = req.read().decode("utf-8", errors="ignore").splitlines()
                  ekstrak_domain_dns(isi)
                  print(f"Sukses tarik: {url}")
              except Exception as e:
                  print(f"Lewati {url}: {e}")

          # Eliminasi subdomain jika domain induk sudah ada
          hasil_bersih = []
          for d in sorted(domain_unik):
              nama_dom = d[2:-1]
              bagian = nama_dom.split(".")
              sudah_tercakup = False
              for i in range(1, len(bagian) - 1):
                  induk = ".".join(bagian[i:])
                  if f"||{induk}^" in domain_unik:
                      sudah_tercakup = True
                      break
              if not sudah_tercakup:
                  hasil_bersih.append(d)

          waktu = datetime.datetime.now(datetime.timezone.utc).strftime("%Y.%m.%d.%H%M")
          header = [
              "! Title: EazyLife - All-in-One Clean Blocklist",
              "! Maintainer: EazyWhale",
              f"! Version: {waktu}",
              f"! Total Unique Domains: {len(hasil_bersih)}",
              "! Sources: easyBlock (Family) + HaGeZi Light + ABPindo + NoCoin",
              "! --------------------------------------------------",
              ""
          ]

          with open("EazyLife.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(header + hasil_bersih) + "\n")
          '

      - name: Simpan EazyLife.txt ke GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add EazyLife.txt
          git diff --staged --quiet || (git commit -m "chore: update EazyLife list" && git push)
          
